<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.rep — mini</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
      :root { --bg: #05060a; }

      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
      }

      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 18px;
        box-sizing: border-box;
        background:
          radial-gradient(1200px 900px at 50% 40%, rgba(120,180,255,0.10), transparent 58%),
          radial-gradient(1200px 900px at 12% 74%, rgba(255,160,80,0.08), transparent 62%),
          radial-gradient(800px 700px at 80% 80%, rgba(120,255,220,0.06), transparent 60%),
          var(--bg);
      }

      .card {
        width: min(760px, 96vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .eye {
        width: min(720px, 96vw);
        aspect-ratio: 16 / 11;
        position: relative;
        border-radius: 34px;
        overflow: visible;
        display: grid;
        place-items: center;
      }

      .eye::before {
        content: "";
        position: absolute;
        inset: -80px;
        background:
          radial-gradient(circle at 50% 50%, rgba(120,180,255,0.26), rgba(0,0,0,0) 60%),
          radial-gradient(circle at 30% 70%, rgba(255,160,80,0.16), rgba(0,0,0,0) 62%);
        filter: blur(26px);
        opacity: 0.65;
        pointer-events: none;
      }

      .eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;

        /* kills the JPEG rectangle */
        -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 62%, rgba(0,0,0,0) 88%);
        mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 62%, rgba(0,0,0,0) 88%);

        transform: scale(1.18);
        transform-origin: center;
        filter: contrast(1.05) saturate(1.05);
      }

      .btnRow {
        width: min(620px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 4px;
      }

      .btn {
        width: 100%;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        padding: 16px 18px;
        font-size: 16px;
        font-weight: 650;
        transition: transform 0.08s ease, opacity 0.12s ease, filter 0.12s ease;
        user-select: none;
      }

      .btn:active { transform: translateY(1px); }

      .btn-primary {
        background: linear-gradient(90deg, rgba(140,200,255,0.95), rgba(155,135,255,0.95));
        color: #0b0c12;
      }

      .btn-primary:hover { opacity: 0.95; }

      .btn-secondary {
        background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.35);
        cursor: not-allowed;
        filter: grayscale(0.2);
      }

      .hint {
        width: min(620px, 92vw);
        font-size: 13px;
        color: rgba(255,255,255,0.78);
        text-align: center;
        line-height: 1.35;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
        min-height: 18px;
      }

      .hint small {
        display: block;
        margin-top: 6px;
        color: rgba(255,255,255,0.55);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <div class="eye">
          <img src="/mini/miniapp-eye-plate.jpg" alt=".rep eye" />
        </div>

        <div class="btnRow">
          <button id="connectBtn" class="btn btn-primary" type="button">Connect Wallet</button>
          <button id="claimBtn" class="btn btn-secondary" type="button" disabled>Claim</button>
        </div>

        <div id="hint" class="hint">
          Identity isn’t minted. It’s earned.
          <small id="subhint">Tip: open this page in Coinbase Wallet (in-app browser) or a browser with a wallet extension.</small>
        </div>
      </div>
    </div>

    <script>
      let connectedAddress = null;

      const connectBtn = document.getElementById("connectBtn");
      const claimBtn = document.getElementById("claimBtn");
      const hintEl = document.getElementById("hint");
      const subhintEl = document.getElementById("subhint");

      function setHint(msg, sub) {
        hintEl.childNodes[0].textContent = msg;
        if (typeof sub === "string") subhintEl.textContent = sub;
      }

      function shortAddr(a) {
        return a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
      }

      function enableClaim() {
        claimBtn.disabled = false;
        claimBtn.classList.remove("btn-secondary");
        claimBtn.classList.add("btn-primary");
        claimBtn.style.cursor = "pointer";
      }

      async function connectWallet() {
        try {
          if (!window.ethereum) {
            setHint(
              "No wallet detected on this browser.",
              "Open dotrep.io/mini/ inside Coinbase Wallet’s in-app browser, or install a wallet extension."
            );
            return;
          }

          setHint("Opening wallet…", "Approve the connection request.");

          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          connectedAddress = accounts && accounts[0] ? accounts[0] : null;

          if (!connectedAddress) {
            setHint("Wallet connection failed.", "Try again.");
            return;
          }

          connectBtn.textContent = "Connected: " + shortAddr(connectedAddress);
          connectBtn.disabled = true;
          connectBtn.style.opacity = "0.9";
          connectBtn.style.cursor = "default";

          enableClaim();
          setHint("Connected.", "Now claim your .rep name.");
        } catch (err) {
          console.error(err);
          setHint("Wallet connection canceled or failed.", "Open DevTools → Console.");
        }
      }

      async function claimName() {
        try {
          if (!connectedAddress) {
            setHint("Connect wallet first.", "Claim unlocks after connecting.");
            return;
          }

          const name = prompt("Choose your .rep name (letters/numbers only):");
          if (!name) return;

          setHint("Checking availability…", "One moment.");

          const checkRes = await fetch(`/api/rep/check?name=${encodeURIComponent(name)}`, {
            method: "GET",
            headers: { "Accept": "application/json" }
          });

          const checkJson = await checkRes.json();

          if (!checkJson.ok) {
            setHint("Invalid name.", "Use letters/numbers only.");
            return;
          }
          if (!checkJson.available) {
            setHint("Taken.", "Try another name.");
            return;
          }

          setHint("Reserving…", "Confirming on server.");

          const reserveRes = await fetch(`/api/rep/reserve`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ name, walletAddress: connectedAddress })
          });

          const reserveJson = await reserveRes.json();

          if (!reserveRes.ok || !reserveJson.ok) {
            setHint(reserveJson?.error ? `Error: ${reserveJson.error}` : "Reserve failed.", "Try again.");
            return;
          }

          setHint(`Reserved @${reserveJson.name} ✅`, "You’re in.");
          claimBtn.disabled = true;
          claimBtn.style.opacity = "0.7";
          claimBtn.style.cursor = "default";
        } catch (err) {
          console.error(err);
          setHint("Something went wrong.", "Open DevTools → Console.");
        }
      }

      connectBtn.addEventListener("click", connectWallet);
      claimBtn.addEventListener("click", claimName);
    </script>
  </body>
</html>
