<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>.rep — mini</title>
    <style>
      :root{
        --bg:#000;
        --text:#fff;
        --muted:rgba(255,255,255,.65);
      }
      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{
        background:var(--bg);
        color:var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }

      .wrap{
        width:100%;
        max-width:720px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:22px;
      }

      /* Make the eye BIG (and responsive) */
      .hero{
        width:min(640px, 92vw);
        height:auto;
        display:block;
        user-select:none;
        -webkit-user-drag:none;
        filter: drop-shadow(0 10px 28px rgba(0,0,0,.65));
      }

      .cta{
        width:min(460px, 92vw);
        height:74px;
        border:0;
        border-radius:999px;
        cursor:pointer;
        color:#fff;
        font-weight:700;
        font-size:22px;
        letter-spacing:.2px;
        background: linear-gradient(90deg, #69d7ff 0%, #7b78ff 45%, #b15bff 100%);
        box-shadow:
          0 14px 30px rgba(0,0,0,.55),
          inset 0 0 0 1px rgba(255,255,255,.16);
        transition: transform .08s ease, filter .15s ease, box-shadow .15s ease;
      }
      .cta:hover{
        filter: brightness(1.06);
        box-shadow:
          0 16px 34px rgba(0,0,0,.60),
          inset 0 0 0 1px rgba(255,255,255,.20);
      }
      .cta:active{ transform: translateY(1px) scale(.995); }

      .tagline{
        font-size:12px;
        line-height:1.3;
        color:var(--muted);
        text-align:center;
        margin-top:-6px;
      }

      /* Slightly tighter spacing on short heights */
      @media (max-height: 720px){
        .wrap{ gap:16px; }
        .cta{ height:68px; font-size:20px; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <!-- Put eye-clean.png in the SAME folder as this index.html -->
      <img class="hero" src="eye-clean.png" alt=".rep eye" />

      <button id="claimBtn" class="cta" type="button">Claim your .rep</button>

      <div class="tagline">Identity isn’t minted. It’s earned.</div>
    </main>

    <script>
      // Use absolute URL so it works both locally (file://) and on dotrep.io/mini/
      const CLAIM_URL = "https://dotrep.io/claim";
      document.getElementById("claimBtn").addEventListener("click", () => {
        window.location.href = CLAIM_URL;
      });
    </script>
  </body>
</html>
