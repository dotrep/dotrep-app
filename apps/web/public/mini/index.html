<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>.rep — Mini</title>
  <meta name="theme-color" content="#05060a" />
  <style>
    :root{
      --bg0:#05060a;
      --bg1:#0a0c12;
      --ink:#eaf0ff;
      --muted:rgba(234,240,255,.72);
      --muted2:rgba(234,240,255,.5);
      --btnText:#0b0f1a;
      --shadow: 0 20px 70px rgba(0,0,0,.55);
      --radius: 18px;
      --btnH: 62px;              /* chunky */
      --btnW: min(520px, 88vw);  /* not skinny */
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink);
      background:
        radial-gradient(1100px 700px at 25% 70%, rgba(255,153,51,.18), transparent 55%),
        radial-gradient(1200px 800px at 70% 40%, rgba(60,140,255,.22), transparent 58%),
        radial-gradient(900px 700px at 55% 15%, rgba(180,90,255,.13), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    /* Center stage */
    .stage{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: clamp(18px, 3.5vw, 34px);
    }

    .stack{
      width: min(920px, 96vw);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 18px;
    }

    /* Eye */
    .eyeWrap{
      width: min(640px, 92vw);
      aspect-ratio: 3 / 4;         /* keeps poster-ish proportions */
      border-radius: 26px;
      overflow:hidden;
      position:relative;
      box-shadow: var(--shadow);
      background: #000;            /* fallback */
      /* keep it big, but not so big it eats buttons */
      max-height: 62vh;
    }

    /* Use the image as a background to eliminate "boxing" seams */
    .eyeWrap::before{
      content:"";
      position:absolute; inset:0;
      background-image: url("./miniapp-eye-plate.jpg");
      background-size: cover;
      background-position: center;
      filter: saturate(1.02) contrast(1.03);
      transform: scale(1.04); /* micro-bleed to avoid edges */
    }

    /* Soft feather into page background */
    .eyeWrap::after{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(closest-side at 50% 48%, transparent 68%, rgba(0,0,0,.55) 92%),
        radial-gradient(closest-side at 50% 20%, transparent 70%, rgba(0,0,0,.45) 92%),
        linear-gradient(180deg, rgba(0,0,0,.20), rgba(0,0,0,.55));
      pointer-events:none;
      mix-blend-mode: multiply;
    }

    /* Buttons */
    .btnCol{
      width: var(--btnW);
      display:flex;
      flex-direction:column;
      gap: 12px;
      align-items:stretch;
    }

    button{
      appearance:none;
      border:0;
      width:100%;
      height: var(--btnH);
      border-radius: calc(var(--btnH) / 2);
      font-weight: 700;
      letter-spacing: .2px;
      font-size: 16px;
      cursor: pointer;
      transition: transform .10s ease, filter .12s ease, opacity .12s ease;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    button:disabled{ cursor:not-allowed; opacity:.45; filter:saturate(.7); }

    .primary{
      color: var(--btnText);
      background: linear-gradient(90deg, rgba(140,190,255,1), rgba(155,120,255,1));
      box-shadow: 0 14px 40px rgba(110,130,255,.22);
    }
    .secondary{
      color: rgba(234,240,255,.92);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .fine{
      font-size: 12px;
      color: var(--muted2);
      text-align:center;
      margin-top: 2px;
      max-width: var(--btnW);
    }

    .toast{
      width: var(--btnW);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      display:none;
    }
    .toast strong{color:var(--ink)}
    .toast.show{display:block}

    /* Small screens: give more room to buttons */
    @media (max-height: 720px){
      .eyeWrap{ max-height: 54vh; }
      :root{ --btnH: 58px; }
    }
    @media (max-width: 420px){
      :root{ --btnH: 60px; }
      .eyeWrap{ border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="stack" role="application" aria-label=".rep mini app">
      <div class="eyeWrap" aria-label=".rep eye"></div>

      <div class="btnCol">
        <button id="connectBtn" class="primary" type="button">Connect Wallet</button>
        <button id="claimBtn" class="secondary" type="button" disabled>Claim</button>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div class="fine">Identity isn’t minted. It’s earned.</div>
    </div>
  </main>

  <script>
    // --- Minimal, production-usable wiring (same-origin) ---
    const connectBtn = document.getElementById('connectBtn');
    const claimBtn   = document.getElementById('claimBtn');
    const toastEl    = document.getElementById('toast');

    let walletAddress = null;

    function showToast(html){
      toastEl.innerHTML = html;
      toastEl.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 5200);
    }

    function hasWalletProvider(){
      return typeof window.ethereum !== 'undefined' && typeof window.ethereum.request === 'function';
    }

    function setConnectedUI(addr){
      walletAddress = addr;
      connectBtn.textContent = addr ? `Connected: ${addr.slice(0,6)}…${addr.slice(-4)}` : 'Connect Wallet';
      connectBtn.disabled = !!addr;
      claimBtn.disabled = !addr;
    }

    async function connectWallet(){
      if(!hasWalletProvider()){
        showToast('<strong>No wallet detected.</strong> Open this page in Coinbase Wallet (in-app browser) or a desktop browser with a wallet extension.');
        return;
      }
      try{
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const addr = (accounts && accounts[0]) ? accounts[0] : null;
        if(!addr){
          showToast('Wallet returned no accounts.');
          return;
        }
        setConnectedUI(addr);
        showToast('Wallet connected. You can claim a <strong>.rep</strong> name now.');
      }catch(err){
        showToast('Wallet connect canceled or failed.');
      }
    }

    function sanitizeName(raw){
      return String(raw || '').trim().toLowerCase();
    }

    async function apiCheck(name){
      const res = await fetch(`/api/rep/check?name=${encodeURIComponent(name)}`, { method:'GET', credentials:'same-origin' });
      if(!res.ok) throw new Error('check_failed');
      return await res.json();
    }

    async function apiReserve(name, wallet){
      const res = await fetch('/api/rep/reserve', {
        method:'POST',
        headers: {'Content-Type':'application/json'},
        credentials:'same-origin',
        body: JSON.stringify({ name, walletAddress: wallet })
      });
      const data = await res.json().catch(()=> ({}));
      if(!res.ok){
        const msg = data && data.error ? data.error : 'reserve_failed';
        throw new Error(msg);
      }
      return data;
    }

    async function claimFlow(){
      if(!walletAddress){
        showToast('Connect your wallet first.');
        return;
      }

      const raw = prompt('Choose your .rep name (letters/numbers/underscore, 3–31 chars):');
      const name = sanitizeName(raw);
      if(!name) return;

      claimBtn.disabled = true;
      claimBtn.textContent = 'Checking…';

      try{
        const check = await apiCheck(name);
        if(!check || check.ok !== true){
          showToast('Could not verify availability. Try again.');
          return;
        }
        if(check.available === false){
          showToast(`<strong>${name}</strong> is taken. Try another.`);
          return;
        }

        claimBtn.textContent = 'Reserving…';
        const reserved = await apiReserve(name, walletAddress);

        showToast(`Reserved <strong>${name}</strong> for <strong>${walletAddress.slice(0,6)}…${walletAddress.slice(-4)}</strong>.`);
        claimBtn.textContent = 'Claimed';
        claimBtn.disabled = true;

      }catch(err){
        const code = String(err && err.message ? err.message : '');
        if(code === 'INVALID_NAME'){
          showToast('Invalid name. Use letters/numbers/underscore, 3–31 chars.');
        }else if(code === 'INVALID_WALLET_ADDRESS'){
          showToast('Wallet address format invalid.');
        }else if(code === 'ALREADY_RESERVED'){
          showToast('That name was just reserved. Try another.');
        }else{
          showToast('Claim failed. Please try again.');
        }
      }finally{
        if(!claimBtn.disabled){
          claimBtn.textContent = 'Claim';
          claimBtn.disabled = !walletAddress;
        }
      }
    }

    // Wire buttons
    connectBtn.addEventListener('click', connectWallet);
    claimBtn.addEventListener('click', claimFlow);

    // If already connected in wallet, enable claim
    (async function bootstrap(){
      if(hasWalletProvider()){
        try{
          const accounts = await window.ethereum.request({ method: 'eth_accounts' });
          const addr = (accounts && accounts[0]) ? accounts[0] : null;
          if(addr) setConnectedUI(addr);
        }catch(_){}
      }
    })();
  </script>
</body>
</html>
