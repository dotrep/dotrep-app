<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>.rep mini</title>
  <style>
    :root{
      --bg:#05070c;
      --btn-radius:999px;
      --btn-h:72px;
      --btn-max:640px;
      --card-radius:28px;
      --shadow:0 24px 70px rgba(0,0,0,.55);
      --ring:0 0 0 1px rgba(255,255,255,.06);
      --text:#e9eefc;
      --muted:rgba(233,238,252,.7);
    }
    html, body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  background: #000;
  color: #eaf0ff;
  overflow-x: hidden;
}
    body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  background: #000;
  color: #eaf0ff;
  overflow-x: hidden;
}
    .bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(900px 700px at 50% 18%, rgba(255,255,255,0.035) 0%, rgba(0,0,0,1) 60%);
  transform: none;
  filter: none;
}
    .bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(1200px 900px at 50% 25%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.85) 70%);
  backdrop-filter: none;
}
    .wrap{
      position:relative;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }
    .stack{
      width:min(860px, 96vw);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }
    .eyeCard{
      width:min(680px, 92vw);
      aspect-ratio: 3 / 4;
      max-height:min(70vh, 740px);
      border-radius: var(--card-radius);
      overflow:hidden;
      box-shadow: var(--shadow);
      position:relative;
      background:#000;
    }
    .eyeCard::before{
      content:"";
      position:absolute; inset:0;
      background: url("/mini/miniapp-eye-plate.jpg") 56% 42%/cover no-repeat;
      transform: scale(1.06);
    }
    .eyeCard::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(520px 360px at 50% 35%, rgba(120,140,255,.20), rgba(0,0,0,0) 60%),
        radial-gradient(520px 360px at 55% 55%, rgba(210,120,255,.14), rgba(0,0,0,0) 65%),
        rgba(0,0,0,.08);
    }
    .btnCol{
      width:min(var(--btn-max), 92vw);
      display:flex;
      flex-direction:column;
      gap:16px;
      align-items:center;
      margin-top: 6px;
    }
    .btn{
      width:100%;
      height:var(--btn-h);
      border-radius: var(--btn-radius);
      border: none;
      cursor:pointer;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .2px;
      color: rgba(255,255,255,.92);
      box-shadow: 0 22px 44px rgba(0,0,0,.55), var(--ring);
      transition: transform .08s ease, filter .08s ease, box-shadow .12s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 28px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px) scale(.995); filter: brightness(.98); }
    .btn:focus-visible{ outline: 2px solid rgba(130,160,255,.55); outline-offset: 3px; }
    .primary{
      background: linear-gradient(90deg, rgba(108,210,255,1) 0%, rgba(113,160,255,1) 45%, rgba(170,95,255,1) 100%);
    }
    .secondary{
      background: linear-gradient(90deg, rgba(108,210,255,.40) 0%, rgba(113,160,255,.32) 45%, rgba(170,95,255,.40) 100%);
      color: rgba(255,255,255,.82);
    }
    .tagline{
      font-size:14px;
      color: var(--muted);
      margin-top: 2px;
      text-align:center;
    }
    @media (max-width: 520px){
      :root{ --btn-h:68px; }
      .btn{ font-size: 28px; }
      .eyeCard{ max-height: 62vh; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="wrap">
    <section class="stack" aria-label=".rep mini app">
      <div class="eyeCard" role="img" aria-label=".rep eye"></div>

      <div class="btnCol">
        <button class="btn primary" onclick="window.location.href='/claim'">Connect Wallet</button>
        <button class="btn secondary" onclick="window.location.href='/claim'">Claim</button>
        <div class="tagline">Identity isn’t minted. It’s earned.</div>
      </div>
    </section>
  </main>
</body>
</html>
