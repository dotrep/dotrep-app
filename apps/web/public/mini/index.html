<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.rep — mini</title>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      :root {
        --bg: #06070a; /* deep near-black */
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: #fff;
      }

      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 18px;
        box-sizing: border-box;
        background:
          radial-gradient(
            900px 600px at 50% 40%,
            rgba(120, 180, 255, 0.1),
            transparent 55%
          ),
          radial-gradient(
            900px 600px at 15% 70%,
            rgba(255, 160, 80, 0.08),
            transparent 60%
          ),
          var(--bg);
      }

      .card {
        width: min(520px, 92vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .eye {
        width: min(420px, 86vw);
        aspect-ratio: 3 / 4;
        display: grid;
        place-items: center;
        border-radius: 22px;
        overflow: hidden;
        position: relative;
      }

      /* This overlay hides JPEG-edge rectangles by blending the borders */
      .eye::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            closest-side at 50% 45%,
            rgba(0, 0, 0, 0) 55%,
            rgba(0, 0, 0, 0.55) 100%
          ),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.35));
        mix-blend-mode: multiply;
      }

      .eye img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: contrast(1.02) saturate(1.02);
      }

      .btn {
        width: 100%;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        padding: 16px 18px;
        font-size: 16px;
        font-weight: 600;
        transition:
          transform 0.08s ease,
          opacity 0.12s ease;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-primary {
        background: linear-gradient(
          90deg,
          rgba(140, 200, 255, 0.95),
          rgba(155, 135, 255, 0.95)
        );
        color: #0b0c12;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.55);
        cursor: not-allowed;
      }

      .hint {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="eye">
          <!-- Absolute path is safest -->
          <img src="/mini/miniapp-eye-plate.jpg" alt=".rep eye" />
        </div>

        <button
          class="btn btn-primary"
          type="button"
          onclick="alert('Wallet connect coming next');"
        >
          Connect Wallet
        </button>

        <button class="btn btn-secondary" type="button" disabled>Claim</button>

        <div class="hint">Identity isn’t minted. It’s earned.</div>
      </div>
    </div>
  </body>
</html>
