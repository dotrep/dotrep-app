<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>.rep mini</title>
<style>
:root { --btn-h:64px; --btn-radius:999px; }
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Inter,system-ui;}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
.eye{width:min(520px,88vw);height:auto;}
.btnCol{width:min(420px,90vw);display:flex;flex-direction:column;gap:14px;}
.btn{height:var(--btn-h);border-radius:var(--btn-radius);border:none;font-size:20px;font-weight:700;cursor:pointer;color:#fff;}
.primary{background:linear-gradient(90deg,#7dd3fc,#a78bfa);}
.secondary{background:linear-gradient(90deg,#334155,#4c1d95);}
.tagline{opacity:.7;font-size:14px;}
</style>
</head>
<body>

<div class="wrap">
  <img src="eye.png" alt=".rep eye" class="eye"/>
  <div class="btnCol">
    <button class="btn primary">Connect Wallet</button>
    <button class="btn secondary">Claim</button>
  </div>
  <div class="tagline">Identity isn’t minted. It’s earned.</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const connectBtn=document.querySelector(".btn.primary");
  const claimBtn=document.querySelector(".btn.secondary");
  const hasWallet=typeof window.ethereum!=="undefined"&&window.ethereum.selectedAddress;
  if(hasWallet){
    connectBtn.textContent="Continue";
    connectBtn.onclick=()=>location.href="https://dotrep.io/claim";
  }else{
    connectBtn.onclick=async()=>{
      try{
        await window.ethereum.request({method:"eth_requestAccounts"});
        location.href="https://dotrep.io/claim";
      }catch(e){console.warn("Wallet rejected");}
    };
  }
  claimBtn.onclick=()=>location.href="https://dotrep.io/claim";
});
</script>

</body>
</html>
